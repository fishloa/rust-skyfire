[package]
name = "skyfire-ts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MPEG-TS / HLS demux for Skyfire — elementary streams + PTS extraction. Planned: rust-dvb dvb-si for PSI."

[dependencies]
broadcast-common = "9"
dvb-si = "9"
dvb-subtitle = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

transmux = "0.23"

[dev-dependencies]
skyfire-ac3 = { path = "../../crates/skyfire-ac3" }
