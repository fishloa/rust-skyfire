[package]
name = "skyfire-ac3"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AC-3 / E-AC-3 audio decoder for Skyfire (→ PCM for WebAudio). The codec browsers refuse; cheap in WASM."

[dependencies]
# >= 0.0.10 required: 0.0.9 mis-decodes real broadcast E-AC-3 (OxideAV#13;
# guarded by tests/oxideav_eac3_correctness.rs, >= 50 dB PSNR vs ffmpeg).
oxideav-ac3 = "0.0.12"
# The unified `decoder::make_decoder` (handles base AC-3 + E-AC-3, dispatched by
# bsid) is built on oxideav-core's `Decoder` trait — needed so base AC-3 (bsid≤8)
# decodes, not just E-AC-3 (issue #43).
oxideav-core = "0.1"
