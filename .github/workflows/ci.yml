name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: cargo nextest run --workspace

  wasm:
    name: wasm32 build (skyfire-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build wasm
        run: cargo build -p skyfire-wasm --target wasm32-unknown-unknown

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with: { targets: wasm32-unknown-unknown }
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      # --out-dir MUST be absolute: wasm-pack resolves a relative --out-dir against
      # the crate dir, not the repo root — a relative path silently builds into
      # crates/skyfire-wasm/packages/core/pkg and leaves the tarball WASM-less (#76).
      - run: wasm-pack build crates/skyfire-wasm --target bundler --release --out-dir "$GITHUB_WORKSPACE/packages/core/pkg"
      - run: rm -f packages/core/pkg/.gitignore
      - run: cd packages/core && npm pack --dry-run
      - run: cd packages/player && npm pack --dry-run
      # Guard: every locally-referenced sibling of each package's entry MUST be in
      # the published tarball, else consumer builds/runtime break. Covers both
      #   import ... from "./x.js"                 (rust-skyfire#76 — hls-source.js)
      #   new URL("./x.js", import.meta.url)       (the AudioWorklet — a RUNTIME
      #     addModule() that a build-only check can't see; was omitted pre-0.2.3).
      - name: Verify tarballs ship every referenced sibling
        run: |
          node -e '
            const {execSync}=require("child_process"), fs=require("fs");
            let bad=0;
            for (const [dir,entry] of [["packages/core","skyfire-core.js"],["packages/player","skyfire-player.js"]]) {
              const packed=new Set(JSON.parse(execSync("npm pack --dry-run --json",{cwd:dir})) [0].files.map(f=>f.path));
              const src=fs.readFileSync(dir+"/"+entry,"utf8");
              const refs=[...src.matchAll(/from\s+"\.\/([A-Za-z0-9_-]+\.js)"/g), ...src.matchAll(/new URL\(\s*"\.\/([A-Za-z0-9_-]+\.js)"/g)];
              for (const m of refs) {
                if (!packed.has(m[1])) { console.error(`MISSING from ${dir} tarball: ${m[1]} (referenced by ${entry})`); bad=1; }
              }
            }
            process.exit(bad);
          '
      # Clean-install smoke test: pack the REAL tarballs, install them into a bare
      # vite app (as a downstream consumer would), and build. Catches missing
      # files (rust-skyfire#76) AND facade/wasm-import mistakes that only surface
      # in a bundler — neither `npm pack --dry-run` nor tsc can see these.
      - name: Consumer build smoke test (pack → vite build)
        run: |
          set -e
          CORE=$(cd packages/core && npm pack --silent)
          PLAYER=$(cd packages/player && npm pack --silent)
          WS="$PWD"
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke/src && cd /tmp/smoke
          echo '{ "name":"smoke","private":true,"type":"module","version":"0.0.0" }' > package.json
          printf 'import wasm from "vite-plugin-wasm";\nimport tla from "vite-plugin-top-level-await";\nexport default { plugins:[wasm(),tla()], logLevel:"warn" };\n' > vite.config.js
          printf 'import { SkyfirePlayer } from "@firemedia/skyfire-player";\nimport "@firemedia/skyfire-player/skyfire-element.js";\nimport { initSkyfire, SkyfireBridge } from "@firemedia/skyfire-core";\nif(!SkyfirePlayer||!initSkyfire||!SkyfireBridge) throw new Error("missing exports");\nif(!customElements.get("skyfire-player")) throw new Error("skyfire-player element not registered");\n' > src/main.js
          printf '<!doctype html><script type="module" src="/src/main.js"></script>\n' > index.html
          npm i --no-audit --no-fund vite@5 vite-plugin-wasm vite-plugin-top-level-await "$WS/packages/core/$CORE" "$WS/packages/player/$PLAYER"
          npx vite build
      - uses: oven-sh/setup-bun@v2
      - run: bun test packages/player/hls-source.test.js
      - run: npx -y -p typescript@5 tsc --noEmit packages/core/index.d.ts
      # Typings test: proves `on()` discriminates its payload per event (#87).
      # types.test-d.ts is compile-time only — @ts-expect-error lines fail the
      # build if the overloads stop narrowing.
      - run: npx -y -p typescript@5 tsc --noEmit -p packages/player


  stream-e2e:
    name: browser stream gate (per-stream continuity)
    runs-on: ubuntu-latest
    # RED until Phase 2 fixes the player. Flip to required (remove
    # continue-on-error) once every committed stream is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with: { targets: wasm32-unknown-unknown }
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: oven-sh/setup-bun@v2
      - name: Build wasm (web target)
        run: wasm-pack build crates/skyfire-wasm --target web --release --out-dir "$GITHUB_WORKSPACE/web/pkg"
      - name: Build server + cli
        run: cargo build -p skyfire-server -p skyfire-cli
      - name: Install player deps + Playwright
        run: cd web && bun install && bunx playwright install --with-deps chromium
      - name: Run per-stream continuity gate
        run: cd web && bun run test:streams

