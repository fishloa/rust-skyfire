name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: cargo nextest run --workspace

  wasm:
    name: wasm32 build (skyfire-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build wasm
        run: cargo build -p skyfire-wasm --target wasm32-unknown-unknown

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with: { targets: wasm32-unknown-unknown }
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: wasm-pack build crates/skyfire-wasm --target bundler --release --out-dir packages/core/pkg
      - run: rm -f packages/core/pkg/.gitignore
      - run: cd packages/core && npm pack --dry-run
      - run: cd packages/player && npm pack --dry-run
      # Guard: every locally-imported sibling (`from "./x.js"`) of each package's
      # entry MUST be in the published tarball, else consumer builds fail
      # (rust-skyfire#76 — hls-source.js was omitted from the 0.2.0 files field).
      - name: Verify tarballs ship every imported sibling
        run: |
          node -e '
            const {execSync}=require("child_process"), fs=require("fs");
            let bad=0;
            for (const [dir,entry] of [["packages/core","skyfire-core.js"],["packages/player","skyfire-player.js"]]) {
              const packed=new Set(JSON.parse(execSync("npm pack --dry-run --json",{cwd:dir})) [0].files.map(f=>f.path));
              const src=fs.readFileSync(dir+"/"+entry,"utf8");
              for (const m of src.matchAll(/from\s+"\.\/([A-Za-z0-9_-]+\.js)"/g)) {
                if (!packed.has(m[1])) { console.error(`MISSING from ${dir} tarball: ${m[1]} (imported by ${entry})`); bad=1; }
              }
            }
            process.exit(bad);
          '
      - uses: oven-sh/setup-bun@v2
      - run: bun test packages/player/hls-source.test.js
      - run: npx -y -p typescript@5 tsc --noEmit packages/core/index.d.ts

